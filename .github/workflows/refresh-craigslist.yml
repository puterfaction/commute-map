name: refresh craigslist listings

on:
  schedule:
    - cron: "17 14 1 * *"   # 1st of each month, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch
        run: python3 pipeline/fetch_listings.py /tmp/new.json
      - name: sanity gate (fails the run on a blocked/empty fetch)
        run: python3 pipeline/check_listings.py /tmp/new.json data/listings-craigslist.json
      - name: publish
        run: |
          mv /tmp/new.json data/listings-craigslist.json
          mkdir -p archive/craigslist
          cp data/listings-craigslist.json "archive/craigslist/$(python3 -c "import json;print(json.load(open('data/listings-craigslist.json'))['asOf'])").json"
          git config user.name "commute-map bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings-craigslist.json archive/craigslist
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "craigslist refresh $(date -u +%F)"
          git push
